:root {
  color-scheme: light;
  --desk: #cdb98f;
  --desk-2: #b59e70;
  --paper: #f5ecd7;
  --paper-2: #ede0c1;
  --ink: #2c2216;
  --ink-soft: #5a4934;
  --faded: #7d6a50;
  --rule: #cdb994;
  --margin: #c47a63;
  --accent: #8a2d1c;
  --gold: #946b22;
  --chip: #e6d6b2;
  --chip-on: #3b2e1e;
  --chip-on-ink: #f5ecd7;
  --shadow: 0 1px 0 rgba(255,255,255,.5) inset, 0 18px 40px rgba(60,40,15,.35), 0 2px 6px rgba(60,40,15,.25);
  --grain: .11;
  --logo-filter: sepia(.35) contrast(1.05);
  /* the desk: oak boards (DECISIONS #90) */
  --wood-1: #a77b4c; --wood-2: #7c5531; --wood-ink: .55; --desk-dim: transparent; --leaf: color-mix(in srgb, var(--paper) 70%, #fff8e8);
  --burn: rgba(110, 66, 22, .42); --burn-2: rgba(70, 38, 10, .5);
  --fell: "IM Fell English", "Palatino Linotype", "Book Antiqua", Georgia, serif;
  --fell-sc: "IM Fell English SC", "IM Fell English", "Palatino Linotype", Georgia, serif;
  --k-place: #2f6b5e; --k-npc: #4b5d8a; --k-rare: #8f5a12; --k-boss: #8a2d1c; --k-quest: #a1661b;
  --k-item: #6a3f8e; --k-treasure: #8b6a10; --k-lore: #5b4a2c; --k-milestone: #2e6f3a; --k-note: #5e5e58;
  --k-recap: #9a4a1a; --k-picture: #33657f;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --desk: #0d0a07; --desk-2: #17120c;
    --paper: #1f1912; --paper-2: #261f16;
    --ink: #eee2c8; --ink-soft: #cdbb98; --faded: #a3916f;
    --rule: #43372a; --margin: #7a3f30;
    --accent: #e8866a; --gold: #e2b65e;
    --chip: #2e261b; --chip-on: #e2b65e; --chip-on-ink: #1f1912;
    --shadow: 0 18px 50px rgba(0,0,0,.6), 0 0 0 1px #3a2f22;
    --grain: .05;
    --logo-filter: none;
    --wood-1: #3a2818; --wood-2: #22170d; --wood-ink: .5; --desk-dim: rgba(10, 6, 3, .62); --leaf: #2d2418;
    --burn: rgba(0, 0, 0, .45); --burn-2: rgba(0, 0, 0, .6);
    --k-place: #6cc3ad; --k-npc: #9cb0e8; --k-rare: #e8a54b; --k-boss: #ef8a72; --k-quest: #f0b860;
    --k-item: #c9a2ea; --k-treasure: #e6c34d; --k-lore: #d2bc90; --k-milestone: #8fd18f; --k-note: #b8b6ac;
    --k-recap: #f09a5e; --k-picture: #8ec5e0;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --desk: #0d0a07; --desk-2: #17120c;
  --paper: #1f1912; --paper-2: #261f16;
  --ink: #eee2c8; --ink-soft: #cdbb98; --faded: #a3916f;
  --rule: #43372a; --margin: #7a3f30;
  --accent: #e8866a; --gold: #e2b65e;
  --chip: #2e261b; --chip-on: #e2b65e; --chip-on-ink: #1f1912;
  --shadow: 0 18px 50px rgba(0,0,0,.6), 0 0 0 1px #3a2f22;
  --grain: .05;
  --logo-filter: none;
  --wood-1: #3a2818; --wood-2: #22170d; --wood-ink: .5; --desk-dim: rgba(10, 6, 3, .62); --leaf: #2d2418;
  --burn: rgba(0, 0, 0, .45); --burn-2: rgba(0, 0, 0, .6);
  --k-place: #6cc3ad; --k-npc: #9cb0e8; --k-rare: #e8a54b; --k-boss: #ef8a72; --k-quest: #f0b860;
  --k-item: #c9a2ea; --k-treasure: #e6c34d; --k-lore: #d2bc90; --k-milestone: #8fd18f; --k-note: #b8b6ac;
  --k-recap: #f09a5e; --k-picture: #8ec5e0;
}

* { box-sizing: border-box; }
html { background: var(--desk); }
body {
  margin: 0;
  min-height: 100vh;
  color: var(--ink);
  background:
    linear-gradient(var(--desk-dim), var(--desk-dim)),
    radial-gradient(ellipse at 50% 30%, transparent 40%, rgba(20, 10, 2, .45) 100%),
    repeating-linear-gradient(to bottom, transparent 0 177px, rgba(25, 12, 2, var(--wood-ink)) 177px 179px, rgba(255, 230, 190, .06) 179px 180px),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='1600' height='640'><filter id='k'><feTurbulence type='fractalNoise' baseFrequency='.0125 .03125' numOctaves='2' seed='11' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .25  0 0 0 0 .14  0 0 0 0 .05  0 0 0 2.4 -1.45'/></filter><rect width='100%' height='100%' filter='url(%23k)'/></svg>"),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='1600' height='640'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='.003125 .09375' numOctaves='4' seed='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .18  0 0 0 0 .1  0 0 0 0 .03  0 0 0 1.25 -.32'/></filter><rect width='100%' height='100%' filter='url(%23g)'/></svg>"),
    linear-gradient(100deg, var(--wood-1), var(--wood-2) 45%, var(--wood-1) 70%, var(--wood-2));
  background-color: var(--wood-2);
  font: 17px/1.55 "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif;
  padding: 32px 16px 64px;
}
.serif-caps { font-variant: small-caps; letter-spacing: .06em; }
a { color: var(--accent); }
a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

/* ---- the notebook ---- */
.page { max-width: 900px; margin: 0 auto; filter: drop-shadow(0 14px 22px rgba(25, 12, 2, .5)) drop-shadow(0 2px 2px rgba(25, 12, 2, .35)); }
.book {
  position: relative;
  max-width: 900px;
  margin: 0 auto;
  background: var(--paper);
  overflow: hidden;
  isolation: isolate;
}
.book > .burn { /* singed, handled edges (DECISIONS #90) */
  position: absolute; inset: 0; z-index: -1; pointer-events: none;
  box-shadow: inset 0 0 0 3px var(--burn-2), inset 0 0 18px 4px var(--burn), inset 0 0 90px 10px color-mix(in srgb, var(--burn) 45%, transparent);
}
.book::before { /* paper grain (an SVG noise, drawn locally) */
  content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none; opacity: var(--grain);
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .25  0 0 0 0 .12  0 0 0 1 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='420' height='420'><filter id='f'><feTurbulence type='fractalNoise' baseFrequency='.012 .22' numOctaves='2' seed='4' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .3  0 0 0 0 .2  0 0 0 0 .08  0 0 0 2.2 -1.25'/></filter><rect width='100%' height='100%' filter='url(%23f)'/></svg>"),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='700' height='900'><filter id='s'><feTurbulence type='fractalNoise' baseFrequency='.008' numOctaves='3' seed='21' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .28  0 0 0 0 .08  0 0 0 3 -1.9'/></filter><rect width='100%' height='100%' filter='url(%23s)'/></svg>");
}
.book::after { /* foxing and worn edges */
  content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(circle at 8% 4%, rgba(140,95,35,.10), transparent 22%),
    radial-gradient(circle at 96% 30%, rgba(140,95,35,.07), transparent 18%),
    radial-gradient(circle at 30% 98%, rgba(140,95,35,.09), transparent 25%),
    linear-gradient(to right, rgba(0,0,0,.07), transparent 3%, transparent 97%, rgba(0,0,0,.05));
}

.book > .wear { /* the journal weathers as it fills (DECISIONS #64): rings and stains, stronger with more entries */
  position: absolute; inset: 0; z-index: -1; pointer-events: none; opacity: calc(var(--wear, 0) * .75);
  background-image:
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='900' height='1500'><g fill='none' stroke='rgb(120,78,36)'><circle cx='770' cy='210' r='58' stroke-width='5' stroke-opacity='.22'/><circle cx='774' cy='206' r='55' stroke-width='2' stroke-opacity='.16'/><circle cx='120' cy='980' r='46' stroke-width='4' stroke-opacity='.17'/><path d='M80 965 a46 46 0 0 1 70 -20' stroke-width='7' stroke-opacity='.10'/></g><g fill='rgb(130,85,40)'><circle cx='640' cy='1240' r='26' fill-opacity='.06'/><circle cx='655' cy='1252' r='9' fill-opacity='.07'/><circle cx='300' cy='420' r='4' fill-opacity='.12'/><circle cx='312' cy='430' r='2.5' fill-opacity='.10'/><circle cx='830' cy='760' r='3' fill-opacity='.12'/><circle cx='60' cy='300' r='14' fill-opacity='.05'/></g></svg>"),
    linear-gradient(to bottom, rgba(110,70,30,.10), transparent 4%, transparent 96%, rgba(110,70,30,.12));
  background-size: 900px 1500px, 100% 100%;
  background-repeat: repeat-y, no-repeat;
}
:root[data-theme="dark"] .book > .wear { opacity: calc(var(--wear, 0) * .35); }

/* ---- margin doodles (DECISIONS #65): small ink drawings, my own line art ---- */
.day { position: relative; }
.doodle { position: absolute; left: -46px; top: 64px; width: 40px; height: 40px; color: var(--ink-soft); opacity: .5; transform: rotate(var(--r, 0deg)); }
.doodle svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }
@media (max-width: 1040px) { .doodle { display: none; } }

/* ---- expedition passport (DECISIONS #63) ---- */
.passport { grid-column: 1 / -1; margin: 18px auto 0; max-width: 760px; }
.passport h2 { margin: 0 0 10px; font-weight: normal; font-family: var(--fell-sc); font-size: 18px; color: var(--faded); letter-spacing: .1em; text-align: center; }
.stamps { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 4px; }
.stamp { width: 104px; height: 104px; }
.stamp svg { width: 100%; height: 100%; overflow: visible; }
.stamp text { font-family: Georgia, serif; text-anchor: middle; dominant-baseline: central; }

/* ---- the expedition's night sky (DECISIONS #71): every boss, rare and milestone a star ---- */
.sky { margin: 30px auto 0; max-width: 900px; }
.sky h2 { margin: 0 0 10px; font-weight: normal; font-family: var(--fell-sc); font-size: 18px; color: var(--faded); letter-spacing: .1em; text-align: center; }
.sky svg { display: block; width: 100%; height: auto; }
.sky .chart-wrap { filter: drop-shadow(0 8px 16px rgba(10, 12, 30, .4)); }
.sky .sky-grid { fill: none; stroke: rgba(232, 220, 181, .13); stroke-width: .8; }
.sky .sky-grid.major { stroke: rgba(232, 220, 181, .22); }
.sky .sky-tick { fill: rgba(232, 220, 181, .45); font-family: var(--fell); font-size: 11px; text-anchor: middle; }
.sky .star { animation: twinkle 4.8s ease-in-out infinite; }
.sky .star:hover .core { r: 4.5px; }
@keyframes twinkle { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
@media (prefers-reduced-motion: reduce) { .sky .star { animation: none; } }
.sky .sky-line { fill: none; stroke: rgba(232, 220, 181, .38); stroke-width: 1; stroke-dasharray: 3 4; }
.sky .cname { fill: #e8dcb5; font-family: var(--fell); font-style: italic; font-size: 18px; text-anchor: middle; }
.sky .cdate { fill: #9d9883; font-family: Georgia, serif; font-size: 10px; letter-spacing: .12em; text-anchor: middle; }
.banner { position: relative; margin: 34px 0 0; text-align: center; }
.banner h2 { margin: 0 0 4px; font-weight: normal; font-family: var(--fell-sc); font-size: 18px; color: var(--faded); letter-spacing: .1em; }
.banner > p { margin: 0 0 10px; font-size: 12px; font-style: italic; color: var(--faded); }
.banner svg { display: block; margin: 0 auto; width: 100%; height: auto; overflow: visible; filter: drop-shadow(0 10px 14px rgba(30, 15, 0, .3)); }
.banner .bn-title { font-family: var(--fell); font-style: italic; text-anchor: middle; letter-spacing: .05em; }
.banner .bn-lvl { font-family: Georgia, serif; font-weight: bold; text-anchor: middle; }
.banner .bn-lvl-small { font-family: Georgia, serif; text-anchor: middle; letter-spacing: .22em; }
.banner .bn-patch { cursor: pointer; outline: none; }
.banner .bn-halo { opacity: 0; transition: opacity .18s ease; pointer-events: none; }
.banner .bn-patch:hover .bn-halo, .banner .bn-patch:focus-visible .bn-halo { opacity: .85; }
.banner .bn-tip {
  position: absolute; z-index: 3; transform: translate(-50%, -100%); max-width: 240px; padding: 6px 11px 7px;
  background: #f6ecd2; color: #2c2216; border: 1px solid #b08a45; border-radius: 4px; text-align: center;
  box-shadow: 0 6px 16px rgba(20, 10, 0, .35); font-size: 13px; line-height: 1.3; pointer-events: none;
}
.banner .bn-tip small { display: block; margin-top: 2px; font-size: 11px; font-style: italic; color: #7d6a50; }
.banner .bn-tip::after { content: ""; position: absolute; left: 50%; bottom: -7px; margin-left: -7px; border: 7px solid transparent; border-bottom: 0; border-top-color: #b08a45; }
.banner .bn-read { min-height: 1.4em; margin: 10px 0 0; font-size: 13px; color: var(--ink-soft); }
.banner .bn-credit { margin: 4px 0 0; font-size: 10px; color: var(--faded); }
.banner .bn-credit a { color: inherit; }
@media (prefers-reduced-motion: reduce) { .banner .bn-halo { transition: none; } }
.patch-modal { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(10, 8, 5, .72); }
.pm-card {
  position: relative; display: flex; gap: 22px; align-items: flex-start; width: 100%; max-width: 580px; max-height: calc(100vh - 32px);
  overflow: auto; padding: 26px 28px 24px; background: var(--paper); color: var(--ink); border: 1px solid var(--rule);
  border-radius: 6px; box-shadow: var(--shadow);
}
.pm-art { flex: none; }
.pm-art svg { display: block; width: 124px; height: 124px; overflow: visible; }
.pm-art .bn-halo { opacity: .3; }  /* a soft glow behind the patch, as if held to the lamp */
.pm-body { min-width: 0; text-align: left; }
.pm-kind { margin: 0; font-family: var(--fell-sc); font-size: 15px; letter-spacing: .1em; color: var(--faded); }
.pm-card h3 { margin: 2px 0 12px; font-family: var(--fell); font-size: 25px; font-weight: normal; font-style: italic; line-height: 1.2; }
.pm-facts { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 0 0 14px; font-size: 14px; }
.pm-facts dt { color: var(--faded); font-variant: small-caps; letter-spacing: .06em; }
.pm-facts dd { margin: 0; }
.pm-story { margin: 0; padding: 10px 14px; border-left: 3px solid var(--gold); background: color-mix(in srgb, var(--gold) 10%, transparent); font-family: var(--fell); font-size: 17px; font-style: italic; line-height: 1.5; }
.pm-sign { display: block; margin-top: 6px; font-size: 12px; font-style: normal; color: var(--faded); }
.pm-sign::before { content: "\2014\00a0"; }
.pm-note { margin: 12px 0 0; font-size: 13px; line-height: 1.45; color: var(--ink-soft); }
.pm-note:empty { display: none; }
.pm-later { display: block; margin-top: 6px; font-style: italic; color: var(--faded); }
.pm-close { position: absolute; top: 6px; right: 10px; padding: 4px 8px; border: 0; background: none; font: inherit; font-size: 26px; line-height: 1; color: var(--faded); cursor: pointer; }
.pm-close:hover, .pm-close:focus-visible { color: var(--ink); }
@media (max-width: 520px) {
  .pm-card { flex-direction: column; align-items: center; padding: 22px 18px 20px; }
  .pm-art svg { width: 96px; height: 96px; }
}
.bounties { margin: 30px auto 0; max-width: 900px; }
.bounties h2 { margin: 0 0 4px; font-weight: normal; font-family: var(--fell-sc); font-size: 18px; color: var(--faded); letter-spacing: .1em; text-align: center; }
.bounties > p { margin: 0 0 14px; text-align: center; font-size: 12px; font-style: italic; color: var(--faded); }
.bounties ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 18px; }
.poster { position: relative; width: 168px; padding: 12px 12px 10px; text-align: center; background: var(--paper-2); color: var(--ink);
  border: 1px solid var(--rule, rgba(90, 70, 40, .35)); box-shadow: 0 2px 0 rgba(60, 40, 10, .08), 0 6px 14px rgba(40, 25, 5, .14); }
.poster:nth-child(odd) { transform: rotate(-1.2deg); }
.poster:nth-child(3n) { transform: rotate(1deg); }
.poster::before { content: ""; position: absolute; top: 5px; left: 50%; width: 7px; height: 7px; margin-left: -3.5px; border-radius: 50%;
  background: #7a5a2e; box-shadow: 0 1px 1px rgba(0, 0, 0, .3); }
.poster .wanted { margin-top: 4px; font-family: var(--fell-sc); font-size: 25px; letter-spacing: .14em; color: var(--k-boss); filter: url(#ink-bleed); }
.poster svg { display: block; width: 64px; height: 52px; margin: 2px auto; color: var(--ink-soft); }
.poster .who { font-family: var(--fell); font-size: 17px; font-style: italic; line-height: 1.2; margin: 2px 0 4px; }
.poster .seen { font-size: 11.5px; line-height: 1.45; color: var(--ink-soft); }
.poster a { color: inherit; }
.poster .stamp { position: absolute; top: 64px; left: 50%; margin-left: -58px; width: 116px; padding: 2px 0; transform: rotate(-14deg);
  border: 3px double #a3261b; color: #a3261b; font-size: 19px; letter-spacing: .2em; font-weight: bold; opacity: .82;
  background: rgba(255, 255, 255, .05); }
.poster.slain svg, .poster.slain .who { opacity: .55; }
.cairns { margin: 30px auto 0; max-width: 900px; }
.cairns h2 { margin: 0 0 4px; font-weight: normal; font-family: var(--fell-sc); font-size: 18px; color: var(--faded); letter-spacing: .1em; text-align: center; }
.cairns > p { margin: 0 0 12px; text-align: center; font-size: 12px; font-style: italic; color: var(--faded); }
.cairns ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 14px 22px; }
.cairns li { width: 150px; text-align: center; font-size: 12px; line-height: 1.45; color: var(--ink-soft); }
.cairns svg { display: block; margin: 0 auto 4px; width: 70px; height: 64px; color: var(--ink-soft); }
.cairns b { display: block; font-weight: normal; font-style: italic; color: var(--ink); font-size: 13px; }
.sky-note { margin: 8px 0 0; text-align: center; font-size: 12px; font-style: italic; color: var(--faded); }

/* ---- title page ---- */
header.title {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 8px 28px;
  align-items: center;
  padding: 40px 48px 28px;
  border-bottom: 1px solid var(--rule);
  background: linear-gradient(to bottom, var(--paper-2), transparent);
}
.medallion {
  width: 128px; height: 128px; border-radius: 50%;
  padding: 5px;
  background: conic-gradient(from 20deg, var(--gold), #f3d58d55, var(--gold), #f3d58d55, var(--gold));
  box-shadow: 0 3px 10px rgba(0,0,0,.25);
}
.medallion img {
  width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block;
  border: 3px solid var(--paper); filter: var(--logo-filter);
}
.title h1 {
  margin: 0; font-weight: normal; font-size: 54px; line-height: 1.05;
  font-family: var(--fell-sc); letter-spacing: .03em; filter: url(#ink-bleed);
}
.title .sub { margin: 4px 0 0; color: var(--ink-soft); font-family: var(--fell); font-style: italic; font-size: 20px; }
.title .begun { margin: 6px 0 0; color: var(--faded); font-size: 14px; }
.ledger {
  grid-column: 1 / -1;
  display: grid; grid-template-columns: repeat(5, 1fr);
  margin-top: 22px; border-top: 2px double var(--rule); border-bottom: 2px double var(--rule);
}
.ledger div { padding: 10px 6px 8px; text-align: center; }
.ledger div + div { border-left: 1px solid var(--rule); }
.ledger b { display: block; font-family: var(--fell); font-size: 32px; font-weight: normal; color: var(--accent); line-height: 1.1; filter: url(#ink-bleed); }
.ledger span { font-family: var(--fell-sc); font-size: 14px; color: var(--faded); letter-spacing: .08em; }

/* ---- the company (characters) ---- */
.roster { grid-column: 1 / -1; margin-top: 22px; }
.roster h2 { margin: 0 0 10px; font-weight: normal; font-family: var(--fell-sc); font-size: 18px; color: var(--faded); letter-spacing: .1em; text-align: center; }
.roster-cards { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; }
.pc {
  position: relative; width: 148px; padding: 14px 10px 10px; display: flex; flex-direction: column; align-items: center; gap: 2px;
  border: 1px solid color-mix(in srgb, var(--rule) 80%, #7a5a2e); border-radius: 2px; color: var(--ink); cursor: pointer;
  background: linear-gradient(160deg, color-mix(in srgb, var(--paper) 92%, #fff), var(--paper-2));
  font: 14px "Palatino Linotype", Georgia, serif; text-align: center;
  box-shadow: 1px 2px 0 rgba(60, 40, 10, .1), 2px 5px 12px rgba(40, 25, 5, .2); transition: box-shadow .15s;
  rotate: -1.4deg;
}
.pc:nth-child(even) { rotate: 1.1deg; }
.pc:nth-child(3n) { rotate: -.4deg; }
.pc::before { /* a strip of tape at the top */
  content: ""; position: absolute; top: -8px; left: 50%; width: 58px; height: 17px; margin-left: -29px; rotate: 2.5deg;
  background: color-mix(in srgb, #e9dcb6 70%, transparent); box-shadow: 0 1px 1px rgba(0, 0, 0, .08);
  border-left: 1px dashed rgba(120, 95, 50, .3); border-right: 1px dashed rgba(120, 95, 50, .3);
}
.pc:nth-child(even)::before { rotate: -3deg; }
.pc:hover { box-shadow: 0 0 0 1px var(--gold), 2px 6px 16px rgba(40, 25, 5, .3); }
.pc[aria-pressed="true"] { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold), 2px 6px 14px rgba(60,40,15,.3); }
.pc-frame {
  width: 92px; height: 116px; border-radius: 46px 46px 6px 6px; overflow: hidden; margin-bottom: 6px;
  border: 3px solid var(--paper); outline: 1.5px solid var(--gold); background: var(--paper-2);
  display: grid; place-items: center; box-shadow: 0 2px 6px rgba(0,0,0,.25);
}
/* Portraits are full-figure shots: frame the head and shoulders. */
.pc-frame img { width: 100%; height: 100%; object-fit: cover; object-position: center 20%; display: block; transform: scale(1.45); transform-origin: 50% 6%;
  filter: sepia(.28) contrast(1.06) saturate(.9); } /* a little of the tintype */
.pc-frame img.framed { transform: none; object-position: center; } /* cropped by hand already */
.pc-frame:has(.pc-credit) { position: relative; }
.pc-credit { position: absolute; left: 0; right: 0; bottom: 3px; font-size: 8px; line-height: 1; letter-spacing: .02em; text-align: center;
  color: rgba(255, 244, 225, .85); text-shadow: 0 0 2px #000, 0 0 3px #000; pointer-events: none; font-style: italic; }
.pc-frame .mono { font-size: 40px; color: var(--gold); font-variant: small-caps; }
.pc-frame svg { width: 46px; height: 46px; color: var(--gold); }
.pc-name { font-family: var(--fell); font-size: 19px; line-height: 1.15; }
.pc-what { color: var(--ink-soft); font-size: 13px; line-height: 1.3; }
.pc-tally { color: var(--faded); font-size: 12px; font-variant: small-caps; letter-spacing: .06em; margin-top: 2px; }
.pc-goals { display: flex; flex-direction: column; gap: 2px; margin-top: 6px; font-size: 12px; line-height: 1.3; color: var(--ink-soft); text-align: left; }
.pc-honours { display: flex; flex-wrap: wrap; justify-content: center; gap: 3px 8px; margin-top: 5px; font-size: 11.5px; font-style: italic; color: var(--gold); }
.pc-honours span::before { content: "\2726\00a0"; } /* a star: an honour */
.pc-goals span::before { content: "\2691\00a0"; color: var(--gold); } /* a flag: the road ahead */

/* ---- controls ---- */
.controls {
  display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center;
  padding: 16px 48px; border-bottom: 1px solid var(--rule);
}
.search {
  flex: 1 1 220px; display: flex; align-items: center; gap: 8px;
  border-bottom: 1.5px solid var(--ink-soft); padding: 2px 2px 4px;
}
.search svg { width: 18px; height: 18px; color: var(--faded); flex: none; }
.search input {
  flex: 1; min-width: 0; border: 0; background: transparent; color: var(--ink);
  font: italic 17px "Palatino Linotype", "Book Antiqua", Georgia, serif; padding: 2px 0;
}
.search input::placeholder { color: var(--faded); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 5px;
  border: 1px solid var(--rule); background: var(--chip); color: var(--ink-soft);
  border-radius: 999px; padding: 3px 10px 3px 7px; font: 13.5px "Palatino Linotype", Georgia, serif;
  font-variant: small-caps; letter-spacing: .05em; cursor: pointer;
}
.chip svg { width: 15px; height: 15px; color: var(--k); }
.chip[aria-pressed="true"] { background: var(--chip-on); color: var(--chip-on-ink); border-color: var(--chip-on); }
.chip[aria-pressed="true"] svg { color: inherit; }
.tools { display: flex; gap: 8px; margin-left: auto; }
.btn {
  border: 1px solid var(--rule); background: transparent; color: var(--ink-soft); cursor: pointer;
  border-radius: 6px; padding: 4px 10px; font: 14px "Palatino Linotype", Georgia, serif;
  display: inline-flex; align-items: center; gap: 6px;
}
.btn svg { width: 16px; height: 16px; }
select.btn { padding-right: 6px; }

/* ---- days ---- */
main { padding: 8px 48px 36px; }
.day { margin-top: 34px; }
.day-head { display: flex; align-items: baseline; gap: 16px; }
.day-num { /* a rubber stamp, inked a little unevenly (DECISIONS #90) */
  font-family: var(--fell-sc); font-size: 17px; color: var(--accent); background: transparent;
  padding: 1px 11px 2px; border: 2px solid var(--accent); outline: 1px solid var(--accent); outline-offset: 2px;
  border-radius: 3px; letter-spacing: .12em; white-space: nowrap;
  transform: rotate(-4deg); filter: url(#stamp-ink); opacity: .9;
}
.day-head h2 { margin: 0; font-weight: normal; font-family: var(--fell); font-size: 31px; }
.day-zones { margin: 2px 0 0; color: var(--faded); font-family: var(--fell); font-size: 16px; font-style: italic; }
.flourish { display: flex; align-items: center; gap: 12px; color: var(--rule); margin: 14px 0 4px; }
.flourish::before, .flourish::after { content: ""; flex: 1; border-top: 1px solid var(--rule); }
.flourish svg { width: 22px; height: 22px; color: var(--gold); opacity: .8; }

/* ---- sessions ---- */
.session { margin-top: 18px; display: grid; grid-template-columns: minmax(0, 1fr) 210px; gap: 0 26px; }
.session.nosketch { grid-template-columns: minmax(0, 1fr); }
.session-head {
  grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px;
  padding-bottom: 6px; margin-bottom: 4px; border-bottom: 1px dashed var(--rule);
}
.session-head h3 { margin: 0; font-family: var(--fell-sc); font-size: 21px; font-weight: normal; letter-spacing: .05em; color: var(--ink); }
.session-head .meta { color: var(--faded); font-size: 14px; }

ol.entries {
  list-style: none; margin: 0; padding: 0;
  /* the notebook's ruled margin */
  background: linear-gradient(to right, transparent 66px, var(--margin) 66px, var(--margin) 67px, transparent 67px,
                              transparent 70px, var(--margin) 70px, var(--margin) 71px, transparent 71px);
  background-repeat: no-repeat;
}
.entry {
  display: grid; grid-template-columns: 58px 34px minmax(0, 1fr); gap: 0 12px;
  padding: 12px 0 12px; border-bottom: 1px solid color-mix(in srgb, var(--rule) 60%, transparent);
}
.entry:last-child { border-bottom: 0; }
.time { text-align: right; color: var(--faded); font-size: 14px; padding-top: 4px; font-variant-numeric: tabular-nums; }
.time small { display: block; font-size: 11.5px; opacity: .85; }
.badge {
  width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
  color: var(--k); border: 1.5px solid var(--k); background: color-mix(in srgb, var(--k) 10%, var(--paper));
  margin-top: 1px;
}
.badge svg { width: 19px; height: 19px; }
.entry h4 { margin: 0; font-family: var(--fell); font-size: 22px; font-weight: normal; line-height: 1.25; }
.entry h4 .kind { font-weight: normal; font-family: var(--fell-sc); font-size: 14px; color: var(--k); letter-spacing: .08em; margin-left: 8px; white-space: nowrap; }
.note {
  margin: 3px 0 4px; color: var(--ink-soft);
  font: 17.5px/1.45 "Ink Free", "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive;
}
.where { font-size: 14px; color: var(--faded); display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: center; }
.where .coords {
  font: 13px Consolas, "Cascadia Mono", "Courier New", monospace; color: var(--ink-soft);
  border: 1px solid var(--rule); border-radius: 3px; padding: 0 5px; background: var(--paper-2);
}
.where a { font-size: 13.5px; text-decoration: none; border-bottom: 1px dotted currentColor; }
.where .approx { font-style: italic; }
.where a.src { white-space: nowrap; }
.switch { list-style: none; display: flex; align-items: center; gap: 10px; margin: 10px 0 2px 82px; color: var(--accent); font-size: 14.5px; font-style: italic; }
.switch::after { content: ""; flex: 1; border-top: 1px dotted var(--rule); }
.switch img, .switch .mono { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; object-position: center 30%; border: 1.5px solid var(--gold); }
.switch .mono { display: grid; place-items: center; font-style: normal; font-size: 13px; color: var(--gold); background: var(--paper-2); }
figure.snap {
  margin: 8px 0 6px; padding: 8px 8px 26px; background: #fbf8f1; display: inline-block; max-width: 100%;
  box-shadow: 1px 2px 0 rgba(0,0,0,.08), 3px 6px 14px rgba(60,40,15,.25); transform: rotate(-.8deg); position: relative; cursor: zoom-in;
}
figure.snap::before {
  content: ""; position: absolute; top: -9px; left: 50%; width: 70px; height: 18px; margin-left: -35px;
  background: color-mix(in srgb, var(--gold) 30%, transparent); transform: rotate(-2deg);
}
figure.snap img { display: block; width: min(520px, 100%); height: auto; aspect-ratio: auto; background: #d9cfba; }
figure.snap figcaption { position: absolute; left: 10px; right: 10px; bottom: 5px; font: 14px "Ink Free", "Segoe Print", cursive; color: #5a4934; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
figure.snap.missing { cursor: default; padding-bottom: 8px; }
figure.snap.missing img { display: none; }
figure.snap.missing::after { content: "picture missing from journal/pictures"; display: block; padding: 26px 30px; font-style: italic; color: #7d6a50; }
.lightbox {
  position: fixed; inset: 0; z-index: 10; background: rgba(10,8,5,.88); display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 12px; padding: 24px; cursor: zoom-out;
}
.lightbox img { max-width: 100%; max-height: calc(100vh - 90px); box-shadow: 0 10px 40px rgba(0,0,0,.6); border: 6px solid #fbf8f1; }
.lightbox p { margin: 0; color: #eee2c8; font-style: italic; text-align: center; }

.chapter {
  grid-column: 1 / -1; margin: 4px 0 14px 82px; padding: 4px 4px 4px 18px; border-left: 3px double var(--k-recap);
}
.chapter .hear { display: flex; align-items: center; gap: 10px; margin: 0 0 8px; font-size: 12px; font-style: italic; color: var(--faded); }
.chapter .hear audio { height: 30px; max-width: 100%; }
.chapter h4 { margin: 0 0 6px; font-family: var(--fell); font-size: 23px; font-weight: normal; font-style: italic; color: var(--k-recap); }
.chapter p { margin: 0 0 8px; font-family: var(--fell); font-size: 18.5px; line-height: 1.55; color: var(--ink); }
.dream { margin: 4px 0 14px 38px; padding: 8px 14px; border-left: 2px dotted var(--k-recap); font-style: italic; color: var(--ink-soft); }
.dream h4 { margin: 0 0 4px; font-size: 13px; font-weight: normal; letter-spacing: .08em; font-variant: small-caps; color: var(--faded); }
.dream p { margin: 0; line-height: 1.6; }
.chapter p:first-of-type::first-letter { /* an illuminated initial */
  float: left; margin: 4px 10px 0 0; padding: 6px 9px 2px; font-family: var(--fell); font-size: 3.1em; line-height: .82;
  color: var(--paper); background: var(--k-recap); border: 1px solid var(--gold); outline: 2px solid var(--k-recap); outline-offset: 2px;
  text-shadow: 0 0 1px rgba(0, 0, 0, .3);
}
.recap { /* a leaf torn from the camp notebook (DECISIONS #90) */
  grid-column: 1 / -1; margin: 16px 0 4px 82px; padding: 18px 20px 16px 56px; position: relative;
  background:
    linear-gradient(to right, transparent 44px, color-mix(in srgb, var(--margin) 55%, transparent) 44px 45px, transparent 45px),
    linear-gradient(170deg, var(--leaf), var(--paper-2));
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--rule) 70%, transparent), inset 0 -10px 18px -10px rgba(90, 60, 20, .18); rotate: -.5deg;
}
.recap::after { /* the pin */
  content: ""; position: absolute; top: 9px; left: 50%; width: 11px; height: 11px; border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #e9a08a, #9a2b1b 60%, #5a160c); box-shadow: 1px 2px 2px rgba(0, 0, 0, .35);
}
.recap svg { position: absolute; left: 16px; top: 14px; width: 26px; height: 26px; color: var(--k-recap); }
.recap h4 { margin: 0 0 4px; font-weight: normal; font-family: var(--fell-sc); letter-spacing: .08em; color: var(--k-recap); font-size: 17px; }
.recap p { margin: 0; font-style: italic; color: var(--ink-soft); line-height: 26px;
  background: repeating-linear-gradient(to bottom, transparent 0 25px, color-mix(in srgb, var(--rule) 85%, transparent) 25px 26px); }

/* ---- trail sketch ---- */
.sketches { display: flex; flex-direction: column; gap: 18px; padding-top: 10px; }
figure.sketch {
  margin: 0; padding: 8px 8px 6px; background: var(--paper-2); border: 1px solid var(--rule);
  box-shadow: 2px 3px 6px rgba(60,40,15,.18); transform: rotate(-1.3deg); position: relative;
}
figure.sketch:nth-child(even) { transform: rotate(1.1deg); }
figure.sketch::before { /* a strip of tape holding it in */
  content: ""; position: absolute; top: -8px; left: 50%; width: 62px; height: 16px; margin-left: -31px;
  background: color-mix(in srgb, var(--gold) 28%, transparent); transform: rotate(2deg);
  border-left: 1px dashed color-mix(in srgb, var(--gold) 40%, transparent); border-right: 1px dashed color-mix(in srgb, var(--gold) 40%, transparent);
}
figure.sketch svg { width: 100%; height: auto; display: block; }
figure.sketch figcaption { text-align: center; font-size: 13px; color: var(--faded); font-variant: small-caps; letter-spacing: .07em; margin-top: 2px; }
.sk-frame { fill: color-mix(in srgb, var(--paper) 60%, transparent); stroke: var(--ink-soft); stroke-width: .5; }
.sk-grid { stroke: var(--rule); stroke-width: .35; stroke-dasharray: 1.2 1.6; }
.sk-lab { font: 3.9px Georgia, serif; fill: var(--faded); text-anchor: middle; dominant-baseline: central; }
.sk-path { fill: none; stroke: var(--ink-soft); stroke-width: .75; stroke-dasharray: 1.8 1.5; stroke-linecap: round; }
.sk-trek { fill: none; stroke: var(--accent); stroke-width: .55; stroke-dasharray: .1 1.25; stroke-linecap: round; stroke-linejoin: round; opacity: .75; }
.sk-dot { stroke: var(--paper); stroke-width: .8; }
.sk-num { font: bold 4px Georgia, serif; fill: var(--paper); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.sk-rose path { fill: none; stroke: var(--ink-soft); stroke-width: .45; }
.sk-rose path.n { fill: var(--accent); stroke: none; }
.sk-map { opacity: .55; filter: sepia(.55) saturate(.85) contrast(.95); }
@media (prefers-color-scheme: dark) { .sk-map { opacity: .45; filter: sepia(.4) brightness(.8); } }
.ex-zone { fill: none; stroke: var(--rule); stroke-width: .5; stroke-dasharray: 2.2 1.4; }
.ex-zname { font: italic 3.6px Georgia, serif; fill: var(--faded); text-anchor: middle; dominant-baseline: central; letter-spacing: .05em; }
.sk-rose text { font: bold 3.4px Georgia, serif; fill: var(--ink-soft); text-anchor: middle; }

/* ---- empty and footer ---- */
.empty { text-align: center; padding: 70px 20px 60px; color: var(--ink-soft); }
.empty svg { width: 80px; height: 80px; color: var(--gold); opacity: .8; }
.empty h2 { font-weight: normal; font-variant: small-caps; letter-spacing: .06em; margin: 12px 0 4px; }
.empty p { margin: 0 auto; max-width: 420px; font-style: italic; color: var(--faded); }
footer { padding: 18px 48px 26px; border-top: 1px solid var(--rule); color: var(--faded); font-size: 13.5px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px; }
[hidden] { display: none !important; }

@media (max-width: 760px) {
  body { padding: 12px 8px 40px; font-size: 16px; }
  header.title { padding: 26px 18px 18px; grid-template-columns: 1fr; justify-items: center; text-align: center; }
  .medallion { width: 104px; height: 104px; }
  .title h1 { font-size: 36px; }
  .ledger { grid-template-columns: repeat(3, 1fr); }
  .ledger div:nth-child(4) { border-left: 0; }
  .ledger div:nth-child(n+4) { border-top: 1px solid var(--rule); }
  .controls { padding: 12px 16px; }
  .tools { margin-left: 0; }
  main { padding: 4px 16px 28px; }
  .session, .session.nosketch { grid-template-columns: minmax(0, 1fr); }
  .sketches { flex-direction: row; flex-wrap: wrap; justify-content: center; }
  figure.sketch { width: min(220px, 100%); }
  ol.entries { background: none; }
  .entry { grid-template-columns: 30px minmax(0, 1fr); }
  .entry .time { grid-column: 2; grid-row: 1; text-align: left; padding: 0; order: -1; }
  .entry .time small { display: inline; margin-left: 6px; }
  .entry .badge { grid-row: 1 / span 2; width: 30px; height: 30px; }
  .entry .body { grid-column: 2; }
  .recap, .chapter { margin-left: 0; }
  .switch { margin-left: 0; }
  .pc { width: 132px; }
  footer { padding: 14px 16px 20px; }
}
@media print {
  html, body { background: #fff; padding: 0; }
  .book { box-shadow: none; }
  .controls { display: none; }
}
</style>

<script type="application/json" id="data">{"entries": [{"id": "2026-11-07-1", "time": "2026-11-07T16:35:11-07:00", "session": "2026-11-07T16:00:17-07:00", "game": "forever", "kind": "quest", "title": "Lunaclaw slain", "note": "Beat Lunaclaw at the Moonkin Stone and spoke to his spirit. Turak Runetotem next for Bear Form.", "zone": "The Barrens", "subzone": "Southern Barrens", "x": 42.0, "y": 60.3, "map_id": 1413, "npc_id": 12138, "quest_id": 6002, "item_id": null, "link": "https://www.wowhead.com/forever/quest=6002", "where_from": "readout", "character": {"name": "Vince Keymaster", "level": 11, "race": "Tauren", "class": "Druid"}, "picture": null, "w": [1, -2461.5, -1633.1]}, {"id": "2026-11-07-2", "time": "2026-11-07T16:47:27-07:00", "session": "2026-11-07T16:00:17-07:00", "game": "forever", "kind": "recap", "title": "Camp notes", "note": "We beat Lunaclaw at the Moonkin Stone in the Southern Barrens and earned Bear Form from Turak in Thunder Bluff. We also worked out which spells shift you out of form and that Ferocity is the usual first talent pick. Next up is Furor and some bear leveling.", "zone": null, "subzone": null, "x": null, "y": null, "map_id": null, "npc_id": null, "quest_id": null, "item_id": null, "link": null, "where_from": "none", "character": {"name": "Vince Keymaster", "level": 11, "race": "Tauren", "class": "Druid"}, "picture": null}, {"id": "2026-11-08-1", "time": "2026-11-08T22:57:05-07:00", "session": "2026-11-08T21:57:45-07:00", "game": "forever", "kind": "boss", "title": "Venture Co. Clearclutter", "note": "Killed the shredder for the Clearcutter Key, then died leaping off a sign.", "zone": "Mulgore", "subzone": "Stonebull Lake", "x": 46.7, "y": 57.7, "map_id": 1412, "npc_id": null, "quest_id": null, "item_id": null, "link": "https://warcraft.wiki.gg/wiki/Venture_Co._Clearclutter", "where_from": "readout", "character": {"name": "Vince Keymaster", "level": 11, "race": "Tauren", "class": "Druid"}, "picture": null, "w": [1, -2100.2, -394.8]}, {"id": "2026-11-08-2", "time": "2026-11-08T23:03:25-07:00", "session": "2026-11-08T21:57:45-07:00", "game": "forever", "kind": "quest", "title": "Ceasing Operations", "note": "Turned in the Clearcutter Key to Morin Cloudstalker; he stood off his minimap marker.", "zone": "Mulgore", "subzone": null, "x": 52.8, "y": 63.7, "map_id": 1412, "npc_id": null, "quest_id": 98427, "item_id": null, "link": "https://www.wowhead.com/forever/quest=98427", "where_from": "readout", "character": {"name": "Vince Keymaster", "level": 11, "race": "Tauren", "class": "Druid"}, "picture": null, "w": [1, -2346.3, -770.2]}, {"id": "2026-11-08-3", "time": "2026-11-08T23:25:58-07:00", "session": "2026-11-08T21:57:45-07:00", "game": "forever", "kind": "recap", "title": "Camp notes", "note": "Tonight we grouped up with a shaman and brought down the Venture Co. Clearclutter for its Clearcutter Key. You took the sign shortcut back from the mine, turned the key in to Morin for Ceasing Operations, and hearthed to Thunder Bluff. Next up are Cairne's quests and Preparation for Ceremony.", "zone": "Thunder Bluff", "subzone": null, "x": null, "y": null, "map_id": null, "npc_id": null, "quest_id": null, "item_id": null, "link": null, "where_from": "readout", "character": {"name": "Vince Keymaster", "level": 11, "race": "Tauren", "class": "Druid"}, "picture": null, "chapter": {"title": "The Shredder and the Sign", "text": "We started the night in Mulgore with Ceasing Operations in the log and no group. Vince shouted through the Venture Co. Mine until a shaman answered, and together we brought down the Venture Co. Clearclutter at the lumber camp, an elite shredder with a nasty Overdrive. The Clearcutter Key dropped, and the fight was won.\n\nThe road back was short and unglamorous. Vince took the shortest way home off a sign and went running as a ghost. Morin Cloudstalker was not where his minimap marker claimed, but we found him by the roadside fire east of Bloodhoof and turned the key in for Thunder Bluff's thanks.\n\nThen it was the hearthstone and the lanterns of Thunder Bluff, with Cairne's errands waiting on the Elder Rise and the auction tents on the Lower Rise.", "audio": "pictures/chapter-2026-11-08-3.wav"}}, {"id": "2026-11-10-1", "time": "2026-11-10T19:46:57-07:00", "session": "2026-11-10T18:06:57-07:00", "game": "forever", "kind": "recap", "title": "Camp notes", "note": "Here's the recap. We rode from Thunder Bluff into the Barrens and spent most of the night around Thorn Hill, hunting the Razormane camps for the supply crate. The quilboar sent us running back as ghosts twice, and we're ending at the Crossroads. Supplies for the Crossroads is still open, so that's where we start next time.", "zone": null, "subzone": null, "x": null, "y": null, "map_id": null, "npc_id": null, "quest_id": null, "item_id": null, "link": null, "where_from": "none", "character": null, "picture": null, "chapter": {"title": "Two Deaths at Thorn Hill", "text": "We left Thunder Bluff behind and rode out onto the red plains of the Barrens, Vince the Tauren druid leading, with a quest log full of errands and a hunt for the Crossroads' supply crates at the top of it.\n\nThorn Hill took most of the evening. We circled the Razormane camps for the better part of an hour, fighting one quilboar after another, and twice they won. Each time we ran back from the Crossroads as ghosts, wry and a little humbled, and each time we tried again.\n\nBy the end we were back at the Crossroads, tired but still standing. The crate was not found, and the quest stays open. Thork will have to wait for another night."}}], "characters": [{"game": "forever", "name": "Vince Keymaster", "level": 12, "race": "Tauren", "class": "Druid", "portrait": "pictures/portrait-forever-vincekeymaster-2026-11-07-144710.jpg", "framed": true, "first_seen": "2026-11-07T14:47:10-07:00", "goals": [], "honours": ["Blooded", "Dungeon Delver"]}, {"game": "forever", "name": "Dr Solanum", "level": null, "race": "Undead", "class": "Warl   // A patch's story (DECISIONS #88): what earned it, where and when, in WALT's words.
  var PATCH_KINDS = { honour: "An honour", boss: "A boss brought down", rare: "A rare slain", level: "Ten more levels" };
  function openPatch(p, from) {
    var m = document.getElementById("patch-modal");

    var facts = [];
    if ((p.who || []).length) facts.push(["Who", p.who.join(", ")]);
    if (p.time) facts.push(["When", longDate(p.time.slice(0, 10)) + ", " + hm(p.time) + " \u00b7 " + partOfDay(p.time)]);
    if (where) facts.push(["Where", where]);
    if (p.reason) facts.push(["For", p.reason.charAt(0).toUpperCase() + p.reason.slice(1)]);

    m.querySelector(".pm-kind").textContent = PATCH_KINDS[p.kind] || "A patch";
    m.querySelector("#pm-title").textContent = p.kind === "level" ? (p.who || [""])[0] + " reached level " + p.label : p.label;
    m.querySelector(".pm-facts").innerHTML = facts.map(function (f) { return "<dt>" + f[0] + "</dt><dd>" + esc(f[1]) + "</dd>"; }).join("");
    var story = m.querySelector(".pm-story");
    story.hidden = !p.story;
    story.innerHTML = p.story ? esc(p.story) + '<span class="pm-sign">WALT, in the expedition log</span>' : "";

      (p.story ? "" : '<span class="pm-later">WALT writes this patch\u2019s story after the next sign-off.</span>');

  // Cairns (DECISIONS #75): one per place we died, a stone added for every fall there.

  function renderSky(entries) {
    var box = document.getElementById("sky");
    var nights = {}, order = [];
    entries.forEach(function (e) {
      var n = nights[e.session];
      if (!n) { n = nights[e.session] = { stars: [], title: "", zone: "", first: e.time }; order.push(e.session); }
      if (e.kind === "recap" && e.chapter && e.chapter.title) n.title = e.chapter.title;
      if (STARS[e.kind]) n.stars.push(e);
      if (!n.zone && e.zone) n.zone = e.zone;
    });
    var groups = order.filter(function (sid) { return nights[sid].stars.length; }).sort();
    if (!groups.length) { box.hidden = true; box.innerHTML = ""; return; }
    var cols = window.innerWidth < 640 ? 1 : Math.min(3, groups.length), W = cols === 1 && window.innerWidth < 640 ? 420 : 900;
    var cw = W / cols, ch = cols === 1 ? 260 : 230, rows = Math.ceil(groups.length / cols), H = rows * ch + 24;

      dust += '<circle cx="' + (h % W) + '" cy="' + ((h >>> 10) % H) + '" r="' + (0.4 + ((h >>> 20) % 9) / 12).toFixed(2) +
        '" fill="#fff" opacity="' + (0.2 + ((h >>> 5) % 40) / 100).toFixed(2) + '"/>';
    }
    var count = 0;
    var art = groups.map(function (sid, gi) {
      var n = nights[sid], x0 = (gi % cols) * cw, y0 = Math.floor(gi / cols) * ch + 12, h0 = scatter(sid);
      var stars = n.stars.slice(0, 14), step = (cw * 0.66) / Math.max(1, stars.length - 1);
      var y = y0 + ch * 0.38 + ((h0 % 50) - 25);
      var pts = stars.map(function (e, i) {
        var h = scatter(sid + e.id);
        y = Math.max(y0 + 26, Math.min(y0 + ch - 80, y + ((h % 70) - 35)));
        var x = stars.length === 1 ? x0 + cw / 2 : x0 + cw * 0.17 + i * step + ((h >>> 8) % 18) - 9;
        return { x: x, y: y, e: e };
      });

      var dots = pts.map(function (p) {
        var s = STARS[p.e.kind], d = new Date(p.e.time);
        var when = isNaN(d) ? "" : " · " + d.getDate() + " " + d.toLocaleString("en-GB", { month: "short" });
        return '<g class="star" style="animation-delay: -' + (hashOf(p.e.id) % 4800) / 1000 + 's">' +
          '<circle cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="' + (s[0] * 3.2).toFixed(1) + '" fill="url(#sky-halo)"/>' +
          '<circle class="core" cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="' + s[0] + '" fill="' + s[1] + '"/>' +
          "<title>" + esc((KINDS[p.e.kind] || p.e.kind) + ": " + p.e.title + when) + "</title></g>";

      return "<g>" + line + dots + '<text class="cname" x="' + (x0 + cw / 2).toFixed(1) + '" y="' + (y0 + ch - 42) + '">' + esc(name) +
        '</text><text class="cdate" x="' + (x0 + cw / 2).toFixed(1) + '" y="' + (y0 + ch - 26) + '">' + esc(date) + "</text></g>";

    // Drawn on a star chart (DECISIONS #90): a planisphere's arcs and hour lines, a double frame, torn edges.

      '<p class="sky-note">Every boss, rare and milestone is a star; each night\'s stars make a constellation.</p>';
  }

  // ---- trail sketch ----
  function sketches(list, sid) {
    var byZone = {}, walked = (TREK[sid] || {}).z || {};
    list.forEach(function (e) {
      if (hasXY(e) && e.zone && e.kind !== "recap") (byZone[e.zone] = byZone[e.zone] || []).push(e);
    });
    function weight(z) { return (byZone[z] || []).length * 20 + (walked[z] || []).length; }
    var zones = Object.keys(byZone).filter(function (z) { return byZone[z].length >= 2; });
    Object.keys(walked).forEach(function (z) { if (zones.indexOf(z) < 0 && walked[z].length >= 8 && (byZone[z] || []).length) zones.push(z); });
    zones = zones.sort(function (a, b) { return weight(b) - weight(a); }).slice(0, 3);
    return zones.map(function (z) {
      var pts = byZone[z] || [], steps = walked[z] || [];
      // Zoom to the ground we covered (map coords run 0-100, y down), at least 16 units across.
      var xs = pts.map(function (e) { return e.x; }).concat(steps.map(function (p) { return p[0]; }));
      var ys = pts.map(function (e) { return e.y; }).concat(steps.map(function (p) { return p[1]; }));
      var span = Math.max(Math.max.apply(null, xs) - Math.min.apply(null, xs),
                          Math.max.apply(null, ys) - Math.min.apply(null, ys), 16) * 1.3;
      var cxm = (Math.max.apply(null, xs) + Math.min.apply(null, xs)) / 2;
      var cym = (Math.max.apply(null, ys) + Math.min.apply(null, ys)) / 2;
      var x0 = Math.min(Math.max(cxm - span / 2, 0), Math.max(0, 100 - span));
      var y0 = Math.min(Math.max(cym - span / 2, 0), Math.max(0, 100 - span));
      function sx(v) { return (8 + (v - x0) / span * 86).toFixed(1); }
      function sy(v) { return (8 + (v - y0) / span * 86).toFixed(1); }
      var step = span > 50 ? 20 : span > 25 ? 10 : 5, grid = "";
      for (var g = Math.ceil(x0 / step) * step; g < x0 + span; g += step) {
        grid += '<line class="sk-grid" x1="' + sx(g) + '" y1="8" x2="' + sx(g) + '" y2="94"/><text class="sk-lab" x="' + sx(g) + '" y="98.2">' + g + "</text>";
      }
      for (g = Math.ceil(y0 / step) * step; g < y0 + span; g += step) {
        grid += '<line class="sk-grid" x1="8" y1="' + sy(g) + '" x2="94" y2="' + sy(g) + '"/><text class="sk-lab" x="4.3" y="' + sy(g) + '">' + g + "</text>";
      }
      var path = pts.map(function (e, i) { return (i ? "L" : "M") + sx(e.x) + " " + sy(e.y); }).join(" ");
      var ids = {};
      pts.forEach(function (e) { if (e.map_id) { var k = e.game + ":" + e.map_id; ids[k] = (ids[k] || 0) + 1; } });
      var mapKey = Object.keys(ids).sort(function (a, b) { return ids[b] - ids[a]; })[0];
      var under = mapKey ? mapImage(mapKey, function (v) { return +sx(v); }, function (v) { return +sy(v); }) : "";
      var clip = "skclip" + pts[0].id.replace(/[^\w-]/g, "");
      var placed = [];
      var dots = pts.map(function (e) {
        // Entries at nearly the same spot fan out around it, so each number shows.
        var ox = +sx(e.x), oy = +sy(e.y), cx = ox, cy = oy, tries = 0;
        function clash() { return placed.some(function (p) { return Math.hypot(p[0] - cx, p[1] - cy) < 7; }); }
        while (clash() && tries < 12) {
          var a = tries * 2.4;
          cx = Math.min(91, Math.max(11, ox + Math.cos(a) * (7 + tries)));
          cy = Math.min(91, Math.max(11, oy + Math.sin(a) * (7 + tries)));
          tries++;
        }
        placed.push([cx, cy]);
        cx = cx.toFixed(1); cy = cy.toFixed(1);
        return '<g><title>' + esc(e._n + ". " + e.title + " (" + e.x.toFixed(1) + ", " + e.y.toFixed(1) + ")") + '</title>' +
          '<circle class="sk-dot" cx="' + cx + '" cy="' + cy + '" r="3.6" style="fill: var(--k-' + e.kind + ')"/>' +
          '<text class="sk-num" x="' + cx + '" y="' + cy + '">' + e._n + "</text></g>";
      }).join("");
      var rose = '<g class="sk-rose" transform="translate(86.5 15.5)"><path d="M0 -5.2 L1.3 0 L0 5.2 L-1.3 0Z"/><path class="n" d="M0 -5.2 L1.3 0 L-1.3 0Z"/><text x="0" y="-6.4">N</text></g>';
      return '<figure class="sketch"><svg viewBox="0 0 100 100" role="img" aria-label="Trail sketch of ' + esc(z) + '">' +
        '<defs><clipPath id="' + clip + '"><rect x="8" y="8" width="86" height="86"/></clipPath></defs>' +
        '<rect class="sk-frame" x="8" y="8" width="86" height="86" rx="1"/>' +
        (under ? '<g clip-path="url(#' + clip + ')">' + under + "</g>" : "") + grid +
        (steps.length > 1 ? '<path class="sk-trek" d="' + steps.map(function (p, i) { return (i ? "L" : "M") + sx(p[0]) + " " + sy(p[1]); }).join(" ") + '"/>' : "") +
        '<path class="sk-path" d="' + path + '"/>' + dots + rose +
        "</svg><figcaption>" + esc(z) + "</figcaption></figure>";
    }).join("");
  }

  // ---- pages ----
  function renderEntry(e) {

  function renderSession(sid, all, shown) {
    var real = all.filter(function (e) { return e.kind !== "recap"; });
    real.forEach(function (e, i) { e._n = i + 1; });
    var items = shown.filter(function (e) { return e.kind !== "recap"; });
    var recaps = shown.filter(function (e) { return e.kind === "recap"; });
    var start = /^\d{4}-\d{2}-\d{2}T/.test(sid) ? sid : all[0].time;
    var zones = [];
    real.forEach(function (e) { if (e.zone && zones.indexOf(e.zone) < 0) zones.push(e.zone); });
    var sk = expedition(items, sid) + sketches(items, sid);
    var names = [];
    real.forEach(function (e) { var w = whoOf(e); if (w && names.indexOf(w) < 0) names.push(w); });
    var many = Object.keys(COMPANY).length > 1 && !state.who;
    var meta = hm(start) + "–" + hm(all[all.length - 1].time) + " · " + plural(real.length, "entry", "entries") +
      (zones.length ? " · " + esc(zones.join(", ")) : "") + (many && names.length === 1 ? " · as " + esc(names[0]) : "");
    // An outing that changed characters marks each change.
    var prev = "";
    var lis = items.map(function (e) {
      var w = whoOf(e), mark = "";
      if (many && names.length > 1 && w && w !== prev) {
        var c = COMPANY[w] || { name: w };
        mark = '<li class="switch">' + face(c) + "<span>as " + esc(w) + (describe(c) ? ", " + esc(describe(c)) : "") + "</span></li>";
      }
      if (w) prev = w;
      return mark + renderEntry(e);
    }).join("");
    var chapters = recaps.filter(function (r) { return r.chapter && r.chapter.text; }).map(function (r) {
      var hear = r.chapter.audio && /^pictures\//.test(r.chapter.audio)
        ? '<p class="hear"><audio controls preload="none" src="' + esc(r.chapter.audio) + '"></audio><span>WALT reads it</span></p>' : "";
      return '<div class="chapter"><h4>' + esc(r.chapter.title || "Chapter") + "</h4>" + hear +
        r.chapter.text.split(/\n\n+/).map(function (p) { return "<p>" + esc(p) + "</p>"; }).join("") + "</div>";
    }).join("") + recaps.filter(function (r) { return r.dream; }).map(function (r) {
      return '<div class="dream"><h4>WALT dreamed</h4><p>' + esc(r.dream) + "</p></div>";  // DECISIONS #70
    }).join("");
    return '<section class="session' + (sk ? "" : " nosketch") + '">' +
      '<div class="session-head"><h3>' + partOfDay(start) + '</h3><span class="meta">' + meta + "</span></div>" + chapters +
      '<div><ol class="entries">' + lis + "</ol></div>" +
      (sk ? '<div class="sketches">' + sk + "</div>" : "") +
      recaps.map(function (r) {
        return '<div class="recap torn" data-tear="4">' + icon("recap") + "<h4>Camp notes · " + hm(r.time) + "</h4><p>" + esc(r.note) + "</p></div>";
      }).join("") + "</section>";
  }

  function render() {
    var inThisGame = ALL.filter(inGame);
    renderRoster(inThisGame);
    renderPassport(inThisGame);
    var real = ALL.filter(function (e) { return e.kind !== "recap"; }).length;
    document.documentElement.style.setProperty("--wear", Math.min(1, real / 150).toFixed(2));
    var game = inThisGame.filter(inWho);
    document.getElementById("sub").textContent = "The expedition log of WALT and " + (state.who || "company");
    renderHead(game);
    renderChips(game);
    renderBanner(game);
    renderBounties();
    renderCairns();
    renderSky(game);
    var pages = document.getElementById("pages");
    if (!game.length) {
      pages.innerHTML = '<div class="empty"><svg><use href="#i-compass"/></svg><h2>The pages are still blank</h2>' +
        "<p>Head out on the road. When we find something worth remembering, WALT writes it down here: " +
        "places, rares, bosses, finds, and a few lines at camp when you sign off.</p></div>";
      document.getElementById("count").textContent = "";
      return;
    }
    var dayOrder = [], days = {};
    game.forEach(function (e) {
      var k = dayKey(e);
      if (!days[k]) { days[k] = { order: [], sessions: {} }; dayOrder.push(k); }
      var s = days[k].sessions;
      if (!s[e.session]) { s[e.session] = []; days[k].order.push(e.session); }
      s[e.session].push(e);
    });
    dayOrder.sort();
    var number = {};
    dayOrder.forEach(function (k, i) { number[k] = i + 1; });
    var keys = state.newest ? dayOrder.slice().reverse() : dayOrder;
    var shownCount = 0;
    var html = keys.map(function (k) {
      var day = days[k], zones = [];
      var body = day.order.map(function (sid) {
        var all = day.sessions[sid];
        var shown = all.filter(matches);
        if (!shown.length) return "";
        shownCount += shown.filter(function (e) { return e.kind !== "recap"; }).length;
        all.forEach(function (e) { if (e.zone && zones.indexOf(e.zone) < 0) zones.push(e.zone); });
        return renderSession(sid, all, shown);
      }).join("");
      if (!body) return "";
      return '<article class="day"><div class="day-head"><span class="day-num">Day ' + number[k] + "</span><div><h2>" +
        longDate(k) + "</h2>" + (zones.length ? '<p class="day-zones">' + esc(zones.join(" · ")) + "</p>" : "") +
        '</div></div><div class="flourish"><svg><use href="#i-compass"/></svg></div>' +
        doodleFor(k, [].concat.apply([], day.order.map(function (sid) { return day.sessions[sid]; }))) + body + "</article>";
    }).join("");
    pages.innerHTML = html || '<div class="empty"><svg><use href="#i-search"/></svg><h2>No pages match</h2><p>Nothing in the journal fits that search.</p></div>';
    var total = game.filter(function (e) { return e.kind !== "recap"; }).length;
    document.getElementById("count").textContent = shownCount === total ? plural(total, "entry", "entries") : shownCount + " of " + plural(total, "entry", "entries") + " shown";
    tearAll();
  }

  // ---- controls ----
  var gameSel = document.getElementById("game");
  var games = [];
  ALL.forEach(function (e) { if (games.indexOf(e.game) < 0) games.push(e.game); });
  if (games.indexOf(state.game) < 0) state.game = games.length ? games[games.length - 1] : state.game;
  if (games.length > 1) {
    gameSel.hidden = false;
    gameSel.innerHTML = games.map(function (g) { return '<option value="' + esc(g) + '">' + esc(GAMES[g] || g) + "</option>"; }).join("");
    gameSel.value = state.game;
    gameSel.addEventListener("change", function () { state.game = gameSel.value; state.kinds = {}; state.who = ""; render(); });
  }
  document.getElementById("q").addEventListener("input", function (ev) { state.q = ev.target.value.trim().toLowerCase(); render(); });
  document.getElementById("chips").addEventListener("click", function (ev) {
    var b = ev.target.closest(".chip");
    if (!b) return;
    var k = b.getAttribute("data-kind");
    state.kinds[k] = !state.kinds[k];
    render();
  });
  var inkBtn = document.getElementById("ink");
  inkBtn.hidden = !(DATA.sketches || []).length;
  function paintInk() { inkBtn.setAttribute("aria-pressed", String(state.ink)); inkBtn.textContent = state.ink ? "Ink: on" : "Ink"; }
  paintInk();
  inkBtn.addEventListener("click", function () {
    state.ink = !state.ink;
    store("walt-journal-ink", state.ink ? "1" : "0");
    paintInk();
    render();
  });

  // ---- soft sounds while reading (DECISIONS #58): made here with Web Audio,
  // no files. Off until clicked: Quiet -> Fireside -> Wind -> Quiet.
  var soundBtn = document.getElementById("sound");
  var SOUNDS = ["quiet", "fire", "wind"], SOUND_LABEL = { quiet: "Quiet", fire: "Fireside", wind: "Wind" };
  var soundMode = "quiet", audio = null, crackle = null;
  var AudioCtx = window.AudioContext || window.webkitAudioContext;
  soundBtn.hidden = !AudioCtx;
  function noise(ctx, seconds) {
    var buf = ctx.createBuffer(1, ctx.sampleRate * seconds, ctx.sampleRate), d = buf.getChannelData(0), last = 0;
    for (var i = 0; i < d.length; i++) { last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02; d[i] = last * 3.5; } // soft brown noise
    return buf;
  }
  function loop(ctx, buf) { var s = ctx.createBufferSource(); s.buffer = buf; s.loop = true; s.start(); return s; }
  function startSound(mode) {
    audio = new AudioCtx();
    var out = audio.createGain();
    out.gain.value = 0;
    out.gain.linearRampToValueAtTime(1, audio.currentTime + 2);  // fade in
    out.connect(audio.destination);
    var bed = loop(audio, noise(audio, 4));
    var filter = audio.createBiquadFilter(), level = audio.createGain();
    bed.connect(filter); filter.connect(level); level.connect(out);
    if (mode === "fire") {
      filter.type = "lowpass"; filter.frequency.value = 500; level.gain.value = 0.35;
      var pops = audio.createBuffer(1, audio.sampleRate * 0.03, audio.sampleRate), p = pops.getChannelData(0);
      for (var i = 0; i < p.length; i++) p[i] = (Math.random() * 2 - 1) * Math.exp(-i / (p.length / 6));
      crackle = setInterval(function () {  // a few pops and snaps each second
        if (!audio || Math.random() < 0.35) return;
        var s = audio.createBufferSource(), g = audio.createGain(), hp = audio.createBiquadFilter();
        hp.type = "highpass"; hp.frequency.value = 1500 + Math.random() * 3000;
        g.gain.value = 0.04 + Math.random() * 0.12;
        s.buffer = pops; s.playbackRate.value = 0.6 + Math.random() * 1.2;
        s.connect(hp); hp.connect(g); g.connect(out);
        s.start(audio.currentTime + Math.random() * 0.2);
      }, 180);
    } else {
      filter.type = "bandpass"; filter.frequency.value = 380; filter.Q.value = 0.6; level.gain.value = 0.5;
      var lfo = audio.createOscillator(), depth = audio.createGain();  // gusts rising and falling
      lfo.frequency.value = 0.08; depth.gain.value = 0.35;
      lfo.connect(depth); depth.connect(level.gain); lfo.start();
      var sweep = audio.createOscillator(), sweepDepth = audio.createGain();
      sweep.frequency.value = 0.05; sweepDepth.gain.value = 180;
      sweep.connect(sweepDepth); sweepDepth.connect(filter.frequency); sweep.start();
    }
  }
  function stopSound() {
    if (crackle) { clearInterval(crackle); crackle = null; }
    if (audio) { var a = audio; audio = null; try { a.close(); } catch (e) {} }
  }
  soundBtn.addEventListener("click", function () {
    stopSound();
    soundMode = SOUNDS[(SOUNDS.indexOf(soundMode) + 1) % SOUNDS.length];
    if (soundMode !== "quiet") { try { startSound(soundMode); } catch (e) { soundMode = "quiet"; } }
    soundBtn.textContent = SOUND_LABEL[soundMode];
    soundBtn.setAttribute("aria-pressed", String(soundMode !== "quiet"));
  });

  var orderBtn = document.getElementById("order");
  orderBtn.addEventListener("click", function () {
    state.newest = !state.newest;
    orderBtn.textContent = state.newest ? "Newest first" : "Oldest first";
    render();
  });
  document.getElementById("roster").addEventListener("click", function (ev) {
    var b = ev.target.closest(".pc");
    if (!b) return;
    var w = b.getAttribute("data-who");
    state.who = state.who === w ? "" : w;
    state.kinds = {};
    store("walt-journal-who", state.who);
    render();
  });
  // A portrait or picture that's gone from journal/pictures: a monogram or a note instead.
  document.addEventListener("error", function (ev) {
    var t = ev.target;
    if (!t || t.tagName !== "IMG") return;
    if (t.getAttribute("data-snap")) { t.closest("figure").classList.add("missing"); return; }
    var m = t.getAttribute("data-mono");
    if (m !== null) { var s = document.createElement("span"); s.className = "mono"; s.textContent = m; t.replaceWith(s); }
  }, true);
  var box = document.getElementById("lightbox");
  function closeBox() { box.hidden = true; box.querySelector("img").removeAttribute("src"); }
  document.getElementById("pages").addEventListener("click", function (ev) {
    var f = ev.target.closest("figure.snap");
    if (!f || f.classList.contains("missing")) return;
    box.querySelector("img").src = f.querySelector("img").getAttribute("src");
    box.querySelector("p").textContent = f.getAttribute("data-cap");
    box.hidden = false;
  });
  box.addEventListener("click", closeBox);
  document.addEventListener("keydown", function (ev) { if (ev.key === "Escape" && !box.hidden) closeBox(); });
  document.getElementById("built").textContent = "Written up " + DATA.built;
  render();
})();
</script>
</body>
</html>
